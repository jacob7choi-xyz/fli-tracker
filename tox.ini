[tox]
envlist = py311, py312, py313
isolated_build = true

[testenv]
deps = 
    pytest>=8.3.4
    pytest-asyncio>=0.25.2
    pytest-xdist>=3.6.1
    pytest-cov>=6.0.0
commands = 
    pytest tests/ -m "not live_api" -v --junitxml=junit.xml
allowlist_externals = pytest

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:coverage]
deps = 
    {[testenv]deps}
    pytest-cov
commands =
    pytest tests/ -m "not live_api" --cov=fli --cov-report=html --cov-report=term-missing

# Opt-in environment for the tests deliberately excluded everywhere else.
# --all is required because conftest drops fuzz-marked tests without it, and
# the fuzz search carries both fuzz and live_api. Expect rate limits.
[testenv:live]
deps = {[testenv]deps}
commands =
    pytest tests/ -m live_api --all -v

[testenv:lint]
deps = 
    ruff>=0.8.4
commands =
    ruff format . --check
    ruff check .
