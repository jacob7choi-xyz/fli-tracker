name: Price Watch (Domestic)

on:
  schedule:
    # Every 6 hours starting at midnight UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      simulate_notify_failure:
        description: "SYNTHETIC FAULT INJECTION: run the sweep with NOTIFY_URL withheld"
        type: boolean
        default: false
      simulate_db_push_failure:
        description: "SYNTHETIC FAULT INJECTION: fail the DB push after archive publication"
        type: boolean
        default: false

permissions:
  contents: write

# Shared serialization across all three watch workflows. queue: max keeps
# every pending run (up to the platform cap of 100) instead of displacing
# the single default pending slot; saturation beyond the cap and platform
# queue-duration limits remain residual risk, bounded by timeout-minutes.
concurrency:
  group: data-branch-write
  cancel-in-progress: false
  queue: max

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          # Deliberately shallow: historical data-branch blobs carry
          # pre-remediation credential residue, so runners fetch full
          # history ONLY in the rare reconciliation path (see push loops).

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra tracker

      - name: Prune old tracker data
        env:
          FLI_DB_PATH: ${{ github.workspace }}/data/tracker.db
        run: uv run python scripts/prune_tracker_db.py

      - name: Record sweep start
        run: echo "SWEEP_START=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Run domestic sweep
        id: sweep
        env:
          FLI_DB_PATH: ${{ github.workspace }}/data/tracker.db
          FLI_SWEEP_RESULT: ${{ github.workspace }}/sweep_result.json
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          SIMULATE_NOTIFY_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_notify_failure }}
        run: |
          if [ "$SIMULATE_NOTIFY_FAILURE" = "true" ]; then
            echo "::warning::SYNTHETIC FAULT INJECTION: NOTIFY_URL withheld from this sweep"
            echo "## SYNTHETIC FAULT INJECTION: notify failure" >> "$GITHUB_STEP_SUMMARY"
            unset NOTIFY_URL
          fi
          uv run fli watch --group domestic --verbose

      - name: Record sweep end
        if: always()
        run: echo "SWEEP_END=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # Archive shards are the authoritative dataset (Tier A). Export and
      # publication run under always() so ordinary sweep/notification
      # failure on a surviving runner cannot prevent them; sudden runner
      # loss remains a bounded one-sweep residual risk.
      - name: Export archive shard and provenance
        id: archive
        if: always() && env.SWEEP_START != ''
        env:
          FLI_DB_PATH: ${{ github.workspace }}/data/tracker.db
          ARCHIVE_DIR: ${{ github.workspace }}/data/archive
          RUNS_DIR: ${{ github.workspace }}/data/runs
          SWEEP_GROUP: domestic
          SLOT_OFFSET_HOURS: "0"
          SWEEP_START: ${{ env.SWEEP_START }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SWEEP_TRIGGER: ${{ github.event_name }}
          FLI_SWEEP_RESULT: ${{ github.workspace }}/sweep_result.json
        run: |
          if [ -z "$SWEEP_END" ]; then
            SWEEP_END=$(date -u +'%Y-%m-%d %H:%M:%S')
            export SWEEP_END
          fi
          uv run python scripts/export_snapshots.py
        # SWEEP_END is inherited from GITHUB_ENV when the record step ran
        # (env not redeclared here so the fallback above can detect absence)

      - name: Push archive (authoritative, before DB)
        id: push_archive
        if: always() && steps.archive.outcome == 'success'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ 2>/dev/null || true
          git add runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            BASE_SHA=$(git rev-parse HEAD)
            git commit -m "Archive domestic sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
            # State-machine proof around the autostash rebase. Exit codes
            # are NOT load-bearing (autostash-conflict exit behavior is not
            # reliably specified); these state assertions are.
            # Precondition: the only tolerated dirty tracked file is
            # tracker.db (committed by the NEXT step) - or a clean tree.
            DIRTY_BEFORE=$(git status --porcelain)
            if [ -n "$DIRTY_BEFORE" ] && [ "$DIRTY_BEFORE" != " M tracker.db" ]; then
              echo "::error::Unexpected dirty worktree at archive push: ${DIRTY_BEFORE}"
              exit 1
            fi
            DB_SHA_BEFORE=$(sha256sum tracker.db | cut -d' ' -f1)
            # Push-first with SHA-identity classification. Writers are
            # serialized by the concurrency group, so the normal path is a
            # plain push. On failure, three identity facts resolve almost
            # everything with no history: remote==local means our push
            # landed (response lost) and Tier A is proven durable;
            # remote==starting-tip means the remote never moved and the
            # failure was network/auth/policy - retry without touching
            # anything. Only a remote differing from BOTH known states is
            # real contention: only then is full history acquired (the
            # shallow checkout omits credential-bearing historical blobs)
            # and the three-valued ancestry guard consulted. Unverifiable
            # states never rebase. A failing rebase fails loudly (bash -e).
            for attempt in 1 2 3; do
              git push && break
              if ! git fetch origin data; then
                if [ $attempt -eq 3 ]; then
                  echo "::error::Failed to push archive to data branch after 3 attempts"
                  exit 1
                fi
                echo "Fetch failed; cannot verify remote state, retrying push without rebase..."
                sleep $((attempt * 5))
                continue
              fi
              REMOTE_SHA=$(git rev-parse FETCH_HEAD)
              if [ "$REMOTE_SHA" = "$(git rev-parse HEAD)" ]; then
                echo "Remote tip equals local HEAD: the push landed and the response was lost. Published."
                break
              fi
              if [ $attempt -eq 3 ]; then
                echo "::error::Failed to push archive to data branch after 3 attempts"
                exit 1
              fi
              if [ "$REMOTE_SHA" = "$BASE_SHA" ]; then
                echo "Remote unmoved since this run started; push failed for another reason. Retrying as-is..."
              else
                echo "Remote differs from both the starting tip and local HEAD; acquiring history for guarded reconciliation..."
                if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                  if ! git fetch --unshallow origin data; then
                    echo "::warning::Could not acquire full history; unverifiable, retrying without rebase..."
                    sleep $((attempt * 5))
                    continue
                  fi
                fi
                # merge-base --is-ancestor is three-valued: 0 = ancestor,
                # 1 = not an ancestor, other = the check itself errored.
                # Only status 1 permits the guarded rebase.
                ANCESTRY=0
                git merge-base --is-ancestor FETCH_HEAD HEAD || ANCESTRY=$?
                if [ "$ANCESTRY" -eq 0 ]; then
                  echo "Fetched tip is already an ancestor of HEAD; retrying push..."
                elif [ "$ANCESTRY" -eq 1 ]; then
                  echo "Fetched tip is not an ancestor of local HEAD; reconciliation required, rebasing under guarded autostash..."
                  git rebase --autostash FETCH_HEAD
                else
                  echo "::warning::Ancestry check errored (status=${ANCESTRY}); unverifiable, retrying without rebase..."
                fi
              fi
              sleep $((attempt * 5))
            done
            # Postconditions: DB bytes identical, no unresolved merge
            # state, and the worktree restored to EXACTLY its entry state
            # (round-trip identity - also correct when the tree was clean).
            DB_SHA_AFTER=$(sha256sum tracker.db | cut -d' ' -f1)
            if [ "$DB_SHA_BEFORE" != "$DB_SHA_AFTER" ]; then
              echo "::error::tracker.db changed across the autostash round trip; refusing to proceed to DB publication"
              exit 1
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Unmerged paths remain after archive rebase/autostash"
              git status --porcelain
              exit 1
            fi
            DIRTY_AFTER=$(git status --porcelain)
            if [ "$DIRTY_AFTER" != "$DIRTY_BEFORE" ]; then
              echo "::error::Worktree state not restored across autostash round trip: before=[${DIRTY_BEFORE}] after=[${DIRTY_AFTER}]"
              exit 1
            fi
          fi

      # tracker.db is non-authoritative operational state (Tier B). Its
      # push is gated so DB size can never again threaten the archive:
      # >= 90 MiB refuses the snapshot outright (GitHub rejects at 100 MiB).
      - name: Push DB snapshot (guarded)
        if: always() && steps.push_archive.outcome == 'success'
        working-directory: data
        env:
          SIMULATE_DB_PUSH_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_db_push_failure }}
        run: |
          if [ "$SIMULATE_DB_PUSH_FAILURE" = "true" ]; then
            echo "::error::SYNTHETIC FAULT INJECTION: DB push failed deliberately"
            {
              echo "## SYNTHETIC FAULT INJECTION: DB push failure"
              echo "DATA COLLECTION: SUCCESS"
              echo "DB SNAPSHOT: FAILED (synthetic)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          DB_BYTES=$(stat -c%s tracker.db)
          WARN_BYTES=$((50 * 1024 * 1024))
          HARD_BYTES=$((90 * 1024 * 1024))
          if [ "$DB_BYTES" -ge "$HARD_BYTES" ]; then
            echo "::error::tracker.db is ${DB_BYTES} bytes (>= 90 MiB safety limit); DB snapshot skipped, archive already durable"
            {
              echo "## DB size safety gate"
              echo "DATA COLLECTION: SUCCESS"
              echo "DB SNAPSHOT: FAILED SAFELY (size limit)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$DB_BYTES" -ge "$WARN_BYTES" ]; then
            echo "::warning::tracker.db is ${DB_BYTES} bytes (>= 50 MiB); investigate growth before the 90 MiB gate"
            echo "WARNING: tracker.db at ${DB_BYTES} bytes (>= 50 MiB)" >> "$GITHUB_STEP_SUMMARY"
          fi
          git add tracker.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit"
          else
            BASE_SHA=$(git rev-parse HEAD)
            git commit -m "Update domestic prices $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Same identity-first pattern as the archive push; the tree is
            # clean after the DB commit, so autostash is a no-op safety net.
            for attempt in 1 2 3; do
              git push && break
              if ! git fetch origin data; then
                if [ $attempt -eq 3 ]; then
                  echo "::error::Failed to push DB to data branch after 3 attempts"
                  exit 1
                fi
                echo "Fetch failed; cannot verify remote state, retrying push without rebase..."
                sleep $((attempt * 5))
                continue
              fi
              REMOTE_SHA=$(git rev-parse FETCH_HEAD)
              if [ "$REMOTE_SHA" = "$(git rev-parse HEAD)" ]; then
                echo "Remote tip equals local HEAD: the push landed and the response was lost. Published."
                break
              fi
              if [ $attempt -eq 3 ]; then
                echo "::error::Failed to push DB to data branch after 3 attempts"
                exit 1
              fi
              if [ "$REMOTE_SHA" = "$BASE_SHA" ]; then
                echo "Remote unmoved since this run started; push failed for another reason. Retrying as-is..."
              else
                echo "Remote differs from both the starting tip and local HEAD; acquiring history for guarded reconciliation..."
                if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                  if ! git fetch --unshallow origin data; then
                    echo "::warning::Could not acquire full history; unverifiable, retrying without rebase..."
                    sleep $((attempt * 5))
                    continue
                  fi
                fi
                # Three-valued check; only status 1 permits the rebase.
                ANCESTRY=0
                git merge-base --is-ancestor FETCH_HEAD HEAD || ANCESTRY=$?
                if [ "$ANCESTRY" -eq 0 ]; then
                  echo "Fetched tip is already an ancestor of HEAD; retrying push..."
                elif [ "$ANCESTRY" -eq 1 ]; then
                  echo "Fetched tip is not an ancestor of local HEAD; reconciliation required, rebasing under guarded autostash..."
                  git rebase --autostash FETCH_HEAD
                else
                  echo "::warning::Ancestry check errored (status=${ANCESTRY}); unverifiable, retrying without rebase..."
                fi
              fi
              sleep $((attempt * 5))
            done
          fi

      # Best-effort human-reach alarm. The red run is the authoritative
      # signal; for push failures specifically, email is independent (it
      # kept working through the entire 2026-06/07 push outage).
      - name: Notify on failure (best effort)
        if: failure()
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python - <<'EOF'
          import os

          import apprise

          ap = apprise.Apprise()
          ap.add(os.environ["NOTIFY_URL"])
          ap.notify(
              title="Price Watch (Domestic) run FAILED",
              body=f"Workflow run failed: {os.environ['RUN_URL']}",
          )
          EOF
