name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

# Read-only: this gate needs no write access and holds no secrets.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.3"

      # 3.12 matches what the sweep workflows run. The package still
      # declares requires-python >= 3.10, but fli/tracker/models.py imports
      # StrEnum (3.11+), so 3.10 cannot import the tracker at all --
      # tightening that metadata is a separate packaging decision.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Check formatting
        run: uv run ruff format . --check

      - name: Check style
        run: uv run ruff check .
