name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

# Read-only: this gate needs no write access and holds no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The uv BINARY is pinned too, not just the action: an unpinned
      # installer would let the resolver drift between runs, which is the
      # opposite of a deterministic gate. 0.11.3 matches NIXPACKS_UV_VERSION
      # so every build path in this repo uses one uv.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.3"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --locked, NOT --frozen. Verified empirically: against a stale lock
      # --frozen installs anyway and says nothing, while --locked reports
      # "the lockfile needs to be updated" and fails. Only --locked gives
      # reproducible resolution AND catches a pyproject change committed
      # without relocking.
      # --extra tracker: the sweeps install it in production. This makes CI
      # a superset of the production dependency set (production extras plus
      # dev/test), not an exact match for it.
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra tracker --locked

      # Excluded by design, not by accident: tests/search and
      # tests/mcp/test_mcp_server.py drive the LIVE Google Flights API and
      # fail on rate limits and network variance. A required check that
      # fails randomly is one the maintainer learns to bypass.
      # Scoped to the file, not the whole tests/mcp directory:
      # test_mcp_server_fixes.py holds 12 deterministic tests worth keeping.
      # Run the excluded ones manually:
      #   uv run pytest tests/search tests/mcp/test_mcp_server.py
      - name: Run tests
        run: >
          uv run pytest tests/
          --ignore=tests/search
          --ignore=tests/mcp/test_mcp_server.py
          -q
        env:
          FORCE_COLOR: 1
