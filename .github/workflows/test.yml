name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

# Read-only: this gate needs no write access and holds no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The uv BINARY is pinned too, not just the action: an unpinned
      # installer would let the resolver drift between runs, which is the
      # opposite of a deterministic gate. 0.11.3 matches NIXPACKS_UV_VERSION
      # so every build path in this repo uses one uv.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.3"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Production boundary check, BEFORE the test superset is installed.
      # The sweeps run exactly `uv sync --extra tracker`; the test job adds
      # dev and mcp on top. Without this step a package missing from the
      # tracker extra but supplied by mcp would pass CI and fail in
      # production. Importing the modules the sweep actually loads proves
      # the tracker extra is independently complete.
      - name: Verify the production dependency set is self-sufficient
        run: |
          uv sync --extra tracker --no-dev --locked
          uv run python -c "import fli.tracker.scanner, fli.tracker.notifier, fli.cli.main"

      # --locked, NOT --frozen. Verified empirically: against a stale lock
      # --frozen installs anyway and says nothing, while --locked reports
      # "the lockfile needs to be updated" and fails. Only --locked gives
      # reproducible resolution AND catches a pyproject change committed
      # without relocking.
      # --extra tracker: the sweeps install it in production. This makes CI
      # a superset of the production dependency set (production extras plus
      # dev/test), not an exact match for it.
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra tracker --locked

      # Excluded by design, not by accident. Tests that drive the LIVE
      # Google Flights API fail on rate limits and network variance, and a
      # required check that fails randomly is one the maintainer learns to
      # bypass. They carry @pytest.mark.live_api, so the classification
      # travels with the test rather than depending on its path: two
      # earlier path-based exclusions had silently swallowed 24
      # deterministic tests that happened to sit beside live ones.
      # strict-markers (pyproject.toml) makes a typo'd marker a collection
      # error, so a live test cannot rejoin this gate by misspelling.
      # Run the excluded set manually. --all is required because
      # conftest drops fuzz-marked tests without it, and the fuzz
      # search is both fuzz and live_api:
      #   uv run pytest -m live_api --all
      - name: Run tests
        run: uv run pytest tests/ -m "not live_api" -q
        env:
          FORCE_COLOR: 1

  # Boundary coverage for the declared support range. Kept SEPARATE from the
  # `test` job on purpose: `test` is a required status check, and a matrix
  # renames its checks to "test (3.11)" and so on, so the required `test`
  # would never report again and every PR would block forever.
  #
  # This exists because requires-python was a claim nobody verified. It said
  # >= 3.10 while fli/tracker/models.py imported StrEnum (3.11+), so the
  # tracker could not import on the version the package advertised. Testing
  # the ends of the range makes the metadata a checked property instead of a
  # comment.
  test-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]  # floor and ceiling; 3.12 is the `test` job

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.3"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra tracker --locked

      # Importing the tracker is the specific thing 3.10 could not do.
      - name: Verify the package imports on this version
        run: uv run python -c "import fli.tracker.models, fli.tracker.scanner, fli.cli.main"

      - name: Run tests
        run: uv run pytest tests/ -m "not live_api" -q
        env:
          FORCE_COLOR: 1
