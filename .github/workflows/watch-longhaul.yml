name: Price Watch (Long-haul)

on:
  schedule:
    # Every 6 hours starting at 1am UTC (offset: domestic=0h, longhaul=1h, coastal=2h)
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      simulate_notify_failure:
        description: "SYNTHETIC FAULT INJECTION: run the sweep with NOTIFY_URL withheld"
        type: boolean
        default: false
      simulate_publish_failure:
        description: "SYNTHETIC FAULT INJECTION: fail Tier-B publication after archive publication"
        type: boolean
        default: false
      simulate_coverage_failure:
        description: "SYNTHETIC FAULT INJECTION: fail coverage regeneration after archive publication"
        type: boolean
        default: false

permissions:
  contents: write

# Shared serialization across all three watch workflows. queue: max keeps
# every pending run (up to the platform cap of 100) instead of displacing
# the single default pending slot; saturation beyond the cap and platform
# queue-duration limits remain residual risk, bounded by timeout-minutes.
concurrency:
  group: data-branch-write
  cancel-in-progress: false
  queue: max

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          # Deliberately shallow: historical data-branch blobs carry
          # pre-remediation credential residue, and no code path fetches
          # history. Remote divergence fails closed (see push loops).

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: uv sync --extra tracker

      - name: Prune old tracker data
        env:
          FLI_DB_PATH: ${{ github.workspace }}/data/tracker.db
        run: uv run python scripts/prune_tracker_db.py

      - name: Record sweep start
        run: echo "SWEEP_START=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Run longhaul sweep
        id: sweep
        env:
          FLI_DB_PATH: ${{ github.workspace }}/data/tracker.db
          FLI_SWEEP_RESULT: ${{ github.workspace }}/sweep_result.json
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          SIMULATE_NOTIFY_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_notify_failure }}
        run: |
          if [ "$SIMULATE_NOTIFY_FAILURE" = "true" ]; then
            echo "::warning::SYNTHETIC FAULT INJECTION: NOTIFY_URL withheld from this sweep"
            echo "## SYNTHETIC FAULT INJECTION: notify failure" >> "$GITHUB_STEP_SUMMARY"
            unset NOTIFY_URL
          fi
          uv run fli watch --group longhaul --verbose

      - name: Record sweep end
        if: always()
        run: echo "SWEEP_END=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # Archive shards are the authoritative dataset (Tier A). Export and
      # publication run under always() so ordinary sweep/notification
      # failure on a surviving runner cannot prevent them; sudden runner
      # loss remains a bounded one-sweep residual risk.
      - name: Export archive shard and provenance
        id: archive
        if: always() && env.SWEEP_START != ''
        env:
          FLI_DB_PATH: ${{ github.workspace }}/data/tracker.db
          ARCHIVE_DIR: ${{ github.workspace }}/data/archive
          RUNS_DIR: ${{ github.workspace }}/data/runs
          SWEEP_GROUP: longhaul
          SLOT_OFFSET_HOURS: "1"
          SWEEP_START: ${{ env.SWEEP_START }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SWEEP_TRIGGER: ${{ github.event_name }}
          FLI_SWEEP_RESULT: ${{ github.workspace }}/sweep_result.json
        run: |
          if [ -z "$SWEEP_END" ]; then
            SWEEP_END=$(date -u +'%Y-%m-%d %H:%M:%S')
            export SWEEP_END
          fi
          uv run python scripts/export_snapshots.py
        # SWEEP_END is inherited from GITHUB_ENV when the record step ran
        # (env not redeclared here so the fallback above can detect absence)

      - name: Push archive (authoritative, before DB)
        id: push_archive
        if: always() && steps.archive.outcome == 'success'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ 2>/dev/null || true
          git add runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            BASE_SHA=$(git rev-parse HEAD)
            git commit -m "Archive longhaul sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Two-phase staging contract: the only tolerated dirty tracked
            # file here is tracker.db (committed by the NEXT step) - or a
            # clean tree. Anything else means a staging bug upstream.
            DIRTY=$(git status --porcelain)
            if [ -n "$DIRTY" ] && [ "$DIRTY" != " M tracker.db" ]; then
              echo "::error::Unexpected dirty worktree at archive push: ${DIRTY}"
              exit 1
            fi
            # Push-first with identity-only classification. Writers are
            # serialized by the shared concurrency group, so the remote
            # CANNOT legitimately move during a run: remote == local HEAD
            # means our push landed and the response was lost (publication
            # proven durable); remote == starting tip means a transient
            # failure (retry); anything else is a violated writer contract
            # (manual push, foreign writer, history rewrite) and FAILS
            # CLOSED - detection over silent reconciliation. No rebase, no
            # autostash, no history acquisition exists on any path.
            for attempt in 1 2 3; do
              git push && break
              if ! git fetch origin data; then
                if [ $attempt -eq 3 ]; then
                  echo "::error::Failed to push archive to data branch after 3 attempts"
                  exit 1
                fi
                echo "Fetch failed; cannot verify remote state, retrying push..."
                sleep $((attempt * 5))
                continue
              fi
              REMOTE_SHA=$(git rev-parse FETCH_HEAD)
              if [ "$REMOTE_SHA" = "$(git rev-parse HEAD)" ]; then
                echo "Remote tip equals local HEAD: the push landed and the response was lost. Published."
                break
              fi
              if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
                echo "::error::Unexpected remote mutation: data branch tip ${REMOTE_SHA} differs from both this run's starting tip ${BASE_SHA} and its local commit. The serialized-writer contract was violated; refusing automated reconciliation. Investigate before re-running."
                exit 1
              fi
              if [ $attempt -eq 3 ]; then
                echo "::error::Failed to push archive to data branch after 3 attempts"
                exit 1
              fi
              echo "Remote unmoved; transient push failure, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
          fi

      # Tier-B preparation. Generation ONLY: this step performs no git
      # mutation, so a crash here leaves at most a dirty working file and
      # never a commit. Its step outcome, not the file on disk, decides
      # whether the rollup may be published: a crashed generator can leave a
      # complete-looking partial file behind.
      # The rollup is also the only repository-native detector for a
      # scheduled slot that produced no run at all, since such an absence
      # leaves no failed run and no in-job alarm, only a hole in the grid.
      - name: Regenerate derived coverage rollup
        id: coverage
        if: always() && steps.push_archive.outcome == 'success'
        env:
          ARCHIVE_DIR: ${{ github.workspace }}/data/archive
          RUNS_DIR: ${{ github.workspace }}/data/runs
          COVERAGE_OUT: ${{ github.workspace }}/data/coverage.csv
          SIMULATE_COVERAGE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_coverage_failure }}
        run: |
          if [ "$SIMULATE_COVERAGE_FAILURE" = "true" ]; then
            echo "::error::SYNTHETIC FAULT INJECTION: coverage regeneration failed deliberately"
            exit 1
          fi
          uv run python scripts/generate_coverage.py

      # Tier-B publication: ONE commit and ONE push, parented on the tip the
      # archive push verified. Two sequential publishers would share mutable
      # local branch state, so a failed publisher's commit would ride out on
      # the next publisher's push and would also corrupt the identity check's
      # base SHA. Publishing once removes that class entirely. A withheld
      # artifact turns the run red but never withholds its sibling, and the
      # shared push fate is a deliberate trade documented in DATA_GAPS.md.
      # See the module docstring in scripts/publish_tier_b.py.
      - name: Publish Tier B (tracker.db and coverage rollup)
        if: always() && steps.push_archive.outcome == 'success'
        env:
          DATA_DIR: ${{ github.workspace }}/data
          COVERAGE_READY: ${{ steps.coverage.outcome == 'success' }}
          COMMIT_LABEL: longhaul
          SIMULATE_PUBLISH_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_publish_failure }}
        run: uv run python scripts/publish_tier_b.py

      # Best-effort human-reach alarm. The red run is the authoritative
      # signal; for push failures specifically, email is independent (it
      # kept working through the entire 2026-06/07 push outage).
      - name: Notify on failure (best effort)
        if: failure()
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python - <<'EOF'
          import os

          import apprise

          ap = apprise.Apprise()
          ap.add(os.environ["NOTIFY_URL"])
          ap.notify(
              title="Price Watch (Long-haul) run FAILED",
              body=f"Workflow run failed: {os.environ['RUN_URL']}",
          )
          EOF
